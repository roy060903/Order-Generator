<!DOCTYPE html>

<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>訂單畫面產生器｜Web 版</title>
  <meta name="theme-color" content="#f36a2a" />

  <script
    src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>

  <style>
    :root{
      --orange:#f36a2a;
      --text:#252629;
      --muted:#8b8d90;
      --line:#dedede;
      --bg:#eeeeef;
      --card:#ffffff;
      --footer:#fafafa;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
    }

    body{
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "PingFang TC",
        "PingFang HK",
        "Microsoft JhengHei",
        "Noto Sans TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
      background:#d7d7da;
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
    }

    .page{
      display:grid;
      grid-template-columns:430px 1fr;
      gap:24px;
      padding:24px;
      align-items:flex-start;
    }

    .control-panel{
      background:#fff;
      border-radius:24px;
      padding:24px;
      box-shadow:0 10px 35px rgba(0,0,0,.08);
      position:sticky;
      top:24px;
      max-height:calc(100vh - 48px);
      overflow:auto;
    }

    .control-panel h1{
      margin:0 0 8px;
      font-size:26px;
      font-weight:800;
    }

    .control-panel p{
      margin:0 0 22px;
      color:#666;
      font-size:14px;
      line-height:1.55;
    }

    .section-title{
      margin:28px 0 12px;
      font-size:18px;
      font-weight:800;
      border-left:5px solid var(--orange);
      padding-left:10px;
    }

    label{
      display:block;
      font-size:13px;
      color:#555;
      font-weight:700;
      margin-bottom:6px;
    }

    input,
    select,
    textarea{
      width:100%;
      border:1px solid #ddd;
      border-radius:14px;
      padding:12px 14px;
      font-size:15px;
      outline:none;
      background:#fafafa;
      margin-bottom:12px;
      font-family:inherit;
    }

    textarea{
      min-height:72px;
      resize:vertical;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:var(--orange);
      background:#fff;
      box-shadow:0 0 0 3px rgba(243,106,42,.14);
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .button-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:6px;
    }

    button{
      border:0;
      border-radius:14px;
      padding:12px 16px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      font-family:inherit;
      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    button:active{
      transform:scale(.98);
    }

    .primary{
      background:var(--orange);
      color:#fff;
      flex:1;
    }

    .secondary{
      background:#f0f0f2;
      color:#222;
    }

    .danger{
      background:#ffe9e9;
      color:#d22222;
    }

    .download{
      background:#111;
      color:#fff;
      width:100%;
      margin-top:16px;
      padding:15px 18px;
    }

    .address-list,
    .order-list{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:10px;
    }

    .mini-item{
      background:#f6f6f7;
      border-radius:14px;
      padding:10px 12px;
      font-size:13px;
      line-height:1.45;
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      align-items:center;
    }

    .mini-item strong{
      display:block;
      font-size:14px;
      margin-bottom:2px;
    }

    .mini-item button{
      padding:8px 10px;
      font-size:12px;
      border-radius:10px;
    }

    .preview-wrap{
      width:100%;
      overflow:auto;
      padding-bottom:24px;
    }

    .phone-scale{
      transform-origin:top left;
      width:1320px;
    }

    /* =========================================================
       1320 × 2868 capture canvas
       ========================================================= */

    .phone{
      width:1320px;
      height:2868px;
      background:var(--bg);
      overflow:hidden;
      position:relative;
      isolation:isolate;
    }

    /* =========================================================
       iOS status bar
       ========================================================= */

    .ios-top{
      height:148px;
      background:#fff;
      position:relative;
      z-index:20;
    }

    .time{
      position:absolute;
      left:88px;
      top:50%;
      transform:translateY(-50%);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
      font-size:52px;
      line-height:1;
      font-weight:700;
      letter-spacing:-2px;
      color:#000;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }

    /* Keep the status indicators in one balanced iPhone-style group. */
    .status-icons{
      position:absolute;
      right:76px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      align-items:center;
      gap:16px;
      height:52px;
      color:#000;
    }

    /* =========================================================
       Cellular signal
       ========================================================= */

    .signal{
      width:58px;
      height:45px;
      display:flex;
      gap:6px;
      align-items:flex-end;
    }

    .signal span{
      width:9px;
      display:block;
      border-radius:4px 4px 2px 2px;
      background:#d2d3d5;
      transition:background .15s ease;
    }

    .signal span:nth-child(1){
      height:14px;
    }

    .signal span:nth-child(2){
      height:24px;
    }

    .signal span:nth-child(3){
      height:34px;
    }

    .signal span:nth-child(4){
      height:44px;
    }

    .signal span.active{
      background:#000;
    }

    /* =========================================================
       Wi-Fi
       ========================================================= */

    .wifi{
      width:58px;
      height:52px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#000;
    }

    .wifi svg{
      width:58px;
      height:58px;
      display:block;
    }

    /* =========================================================
       Battery
       ========================================================= */

    .battery-wrap{
      width:88px;
      height:50px;
      position:relative;
      display:flex;
      align-items:center;
    }

    .battery-shell{
      width:76px;
      height:44px;
      border-radius:13px;
      background:transparent;
      position:relative;
      overflow:hidden;
    }

    .battery-fill{
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:70%;
      border-radius:13px 7px 7px 13px;
      background:#000;
      z-index:2;
      transition:
        width .2s ease,
        background .2s ease;
    }

    .battery-fill.low{
      background:#ff3b30;
    }

    .battery-fill.medium{
      background:#f36a2a;
    }

    .battery-fill.high{
      background:#000;
    }

    .battery-empty{
      position:absolute;
      right:0;
      top:0;
      bottom:0;
      width:100%;
      border-radius:13px;
      background:#c7c8ca;
      z-index:1;
    }

    .battery-number{
      position:absolute;
      inset:0;
      z-index:3;
      display:flex;
      align-items:center;
      justify-content:center;
      padding-right:7px;
      font-size:36px;
      line-height:1;
      font-weight:700;
      color:#fff;
      letter-spacing:-2px;
      font-variant-numeric:tabular-nums;
    }

    .battery-tip{
      width:6px;
      height:18px;
      margin-left:3px;
      border-radius:0 4px 4px 0;
      background:#bfc0c2;
    }

    /* =========================================================
       Header
       ========================================================= */

    .app-header{
      height:284px;
      background:#fff;
      position:relative;
      z-index:20;
      border-bottom:1px solid #dddddd;
    }

    .back-btn{
      position:absolute;
      left:88px;
      top:58px;
      width:34px;
      height:34px;
      transform:rotate(45deg);
      border-left:6px solid #55585c;
      border-bottom:6px solid #55585c;
      border-radius:2px;
    }

    .title{
      position:absolute;
      top:59px;
      left:0;
      right:0;
      text-align:center;
      font-size:49px;
      line-height:1.1;
      font-weight:700;
      letter-spacing:.2px;
      color:#28292c;
    }

    .tabs{
      position:absolute;
      bottom:0;
      left:0;
      width:100%;
      height:129px;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
    }

    .tab{
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:42px;
      line-height:1;
      font-weight:500;
      color:#8b8b8d;
      position:relative;
      padding-top:8px;
      cursor:pointer;
      letter-spacing:0;
    }

    .tab.active{
      color:#2a2b2e;
      font-weight:700;
    }

    .tab.active::after{
      content:"";
      position:absolute;
      bottom:0;
      left:50%;
      width:442px;
      height:5px;
      background:var(--orange);
      border-radius:999px;
      transform:translateX(-50%);
    }

    .content-bg{
      position:absolute;
      top:432px;
      left:0;
      right:0;
      bottom:0;
      background:var(--bg);
      z-index:1;
    }

    /* =========================================================
       Orders
       ========================================================= */

    .orders-area{
      position:absolute;
      top:456px;
      left:0;
      right:0;
      bottom:0;
      padding:0 24px 80px;
      overflow:hidden;
      background:var(--bg);
      z-index:3;
    }

    .order-card{
      background:#fff;
      border-radius:24px;
      height:542px;
      margin-bottom:48px;
      position:relative;
      overflow:hidden;
      box-shadow:0 16px 32px rgba(0,0,0,.055);
    }

    .order-top{
      height:374px;
      padding:36px 42px 0;
      background:#fff;
    }

    .order-date{
      font-size:43px;
      line-height:1;
      font-weight:400;
      color:#8c8d90;
      letter-spacing:-.7px;
      white-space:nowrap;
      overflow:hidden;
    }

    .divider{
      height:2px;
      background:#e0e0e0;
      margin-top:40px;
      margin-bottom:49px;
      width:100%;
    }

    .route{
      display:grid;
      grid-template-columns:72px 1fr;
      column-gap:24px;
      align-items:start;
    }

    .route-icons{
      position:relative;
      height:160px;
    }

    .origin-icon{
      position:absolute;
      left:20px;
      top:8px;
      width:30px;
      height:30px;
      border:5px solid var(--orange);
      border-radius:50%;
      background:#fff;
    }

    .pin-icon{
      position:absolute;
      left:15px;
      top:94px;
      width:40px;
      height:54px;
      color:var(--orange);
    }

    .pin-icon svg{
      width:40px;
      height:54px;
      display:block;
    }

    .route-text{
      height:160px;
      display:grid;
      grid-template-rows:48px 48px;
      row-gap:46px;
      align-items:start;
    }

    .address{
      font-size:40px;
      line-height:48px;
      font-weight:600;
      color:#27282b;
      letter-spacing:-.6px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:clip;
    }

    .address.second{
      line-height:48px;
      transform:translateY(1px);
    }

    .order-bottom{
      height:168px;
      background:var(--footer);
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      padding:26px 28px 26px 50px;
    }

    .vehicle{
      font-size:41px;
      line-height:1;
      font-weight:400;
      color:#303236;
      letter-spacing:-1px;
      margin-bottom:16px;
    }

    .delivery-row{
      display:flex;
      align-items:center;
      gap:12px;
      color:#909195;
      font-size:32px;
      line-height:1;
      font-weight:400;
    }

    .box-icon{
      width:32px;
      height:32px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex:0 0 32px;
    }

    .box-icon .delivery-logo{
      width:32px;
      height:32px;
      display:block;
      overflow:visible;
      flex:0 0 32px;
    }

    .price{
      font-size:47px;
      line-height:1;
      font-weight:600;
      color:#2c2d30;
      letter-spacing:-.9px;
      white-space:nowrap;
      align-self:end;
      margin-bottom:8px;
    }

    .empty-message{
      background:#fff;
      border-radius:24px;
      padding:70px 50px;
      font-size:42px;
      color:#8f9097;
      text-align:center;
      line-height:1.5;
      box-shadow:0 16px 32px rgba(0,0,0,.055);
    }

    .hint{
      font-size:12px;
      color:#777;
      line-height:1.5;
      margin-top:10px;
    }

    .toolbar-note{
      background:#f7f8fa;
      border-radius:14px;
      padding:12px 14px;
      color:#555;
      font-size:13px;
      line-height:1.5;
      margin-top:12px;
    }

    /* Battery slider */

    #batteryInput{
      width:100%;
      height:28px;
      padding:0;
      margin:0 0 12px;
      background:transparent;
      border:0;
      box-shadow:none;
      accent-color:var(--orange);
      cursor:pointer;
    }

    .battery-setting{
      background:#f7f8fa;
      border-radius:14px;
      padding:12px 14px;
      margin-bottom:12px;
    }

    .battery-setting-value{
      font-size:15px;
      font-weight:800;
      color:var(--orange);
    }

    @media (max-width:1100px){
      html,body{width:100%;min-height:100%;overflow-x:hidden;}
      body{background:#fff;}
      .page{display:block;width:100%;min-height:100dvh;padding:0;gap:0;}
      .control-panel{
        position:static;width:100%;max-height:none;box-sizing:border-box;
        border-radius:0;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 18px);
        box-shadow:none;
      }
      .preview-wrap{width:100vw;overflow:hidden;padding:0;border-radius:0;background:var(--bg);}
      .phone-scale{width:1320px;height:2868px;transform-origin:top left;}
    }
  </style>

</head>

<body>

  <div class="page">


<aside class="control-panel">

  <h1>訂單畫面產生器</h1>

  <p>
    可輸入日期時間、車種、價錢、起點及終點，
    生成接近參考圖嘅手機訂單畫面。
  </p>


  <!-- =====================================================
       電話狀態列
       ===================================================== -->

  <div class="section-title">電話狀態列</div>

  <div class="row">

    <div>
      <label for="phoneTimeInput">電話時間</label>

      <input
        id="phoneTimeInput"
        type="time"
        value="09:52"
      />
    </div>

    <div>
      <label for="signalInput">網絡格數</label>

      <select id="signalInput">
        <option value="0">0 格</option>
        <option value="1">1 格</option>
        <option value="2">2 格</option>
        <option value="3">3 格</option>
        <option value="4" selected>4 格</option>
      </select>
    </div>

  </div>

  <div class="battery-setting">

    <label for="batteryInput">
      電量：
      <span
        id="batteryValueLabel"
        class="battery-setting-value"
      >
        70%
      </span>
    </label>

    <input
      id="batteryInput"
      type="range"
      min="0"
      max="100"
      value="70"
      step="1"
    />

  </div>

  <div class="toolbar-note">
    電量會按比例顯示。50% 或以上為黑色，
    20%～49% 為橙色，19% 或以下為紅色。
    設定會自動儲存。
  </div>


  <!-- =====================================================
       新增訂單
       ===================================================== -->

  <div class="section-title">新增訂單紀錄</div>

  <div class="row">

    <div>
      <label for="orderStatus">分頁狀態</label>

      <select id="orderStatus">
        <option value="completed">已完成</option>
        <option value="active">進行中</option>
        <option value="cancelled">已取消</option>
      </select>
    </div>

    <div>
      <label for="vehicle">車種</label>

      <select id="vehicle">
        <option value="Van仔">Van仔</option>
        <option value="貨Van">貨Van</option>
        <option value="私家車">私家車</option>
        <option value="5.5噸">5.5噸</option>
        <option value="9噸">9噸</option>
        <option value="電單車">電單車</option>
      </select>
    </div>

  </div>


  <div class="row">

    <div>
      <label for="dateInput">日期</label>

      <input
        id="dateInput"
        type="date"
      />
    </div>

    <div>
      <label for="timeInput">時間</label>

      <input
        id="timeInput"
        type="time"
      />
    </div>

  </div>


  <label for="priceInput">價錢</label>

  <input
    id="priceInput"
    type="number"
    min="0"
    step="0.01"
    placeholder="例如 232"
  />


  <label for="originSelect">
    起點：從地址簿選擇
  </label>

  <select id="originSelect">
    <option value="">不使用地址簿</option>
  </select>


  <label for="originInput">起點地址</label>

  <textarea
    id="originInput"
    placeholder="例如：牛頭角救護站"
  ></textarea>


  <label for="destinationSelect">
    終點：從地址簿選擇
  </label>

  <select id="destinationSelect">
    <option value="">不使用地址簿</option>
  </select>


  <label for="destinationInput">終點地址</label>

  <textarea
    id="destinationInput"
    placeholder="例如：薄扶林救護站"
  ></textarea>


  <div class="button-row">

    <button
      class="primary"
      type="button"
      onclick="addOrder()"
    >
      新增訂單
    </button>

    <button
      class="secondary"
      type="button"
      onclick="clearOrderForm()"
    >
      清空
    </button>

  </div>


  <div class="toolbar-note">
    日期會自動顯示成「週一、週二……」，
    時間顯示上午／下午制，
    價錢自動格式化為 HK$xxx.xx。
  </div>


  <!-- =====================================================
       地址簿
       ===================================================== -->

  <div class="section-title">常用地址簿</div>

  <label for="addressName">地址名稱</label>

  <input
    id="addressName"
    type="text"
    placeholder="例如：牛頭角救護站"
  />


  <label for="addressValue">完整地址</label>

  <textarea
    id="addressValue"
    placeholder="例如：牛頭角救護站"
  ></textarea>


  <div class="button-row">

    <button
      class="primary"
      type="button"
      onclick="saveAddress()"
    >
      儲存地址
    </button>

  </div>


  <div
    id="addressList"
    class="address-list"
  ></div>


  <!-- =====================================================
       訂單管理
       ===================================================== -->

  <div class="section-title">訂單管理</div>

  <div
    id="orderList"
    class="order-list"
  ></div>


  <button
    id="downloadBtn"
    class="download"
    type="button"
    onclick="downloadPNG()"
  >
    下載訂單畫面 PNG
  </button>


  <div class="hint">
    圖片輸出尺寸為 1320 × 2868 px。
    在瀏覽器內按一下即可下載 PNG；iPhone / iPad 可從 Safari 的下載項目開啟或分享。
  </div>

</aside>


<!-- =======================================================
     手機預覽
     ======================================================= -->

<main class="preview-wrap">

  <div class="phone-scale">

    <div
      id="captureArea"
      class="phone"
    >

      <!-- =================================================
           iOS Status Bar
           ================================================= -->

      <div class="ios-top">

        <div
          id="statusTime"
          class="time"
        >
          09:52
        </div>


        <div class="status-icons">

          <!-- Cellular -->

          <div
            class="signal"
            aria-label="訊號"
          >
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>


          <!-- Wi-Fi -->

          <div
            class="wifi"
            aria-label="Wi-Fi"
          >

            <svg
              viewBox="0 0 48 48"
              aria-hidden="true"
            >

              <path
                d="M4.5 17.1C15.4 7.7 32.6 7.7 43.5 17.1l-4.6 5C30.6 15 17.4 15 9.1 22.1l-4.6-5Z"
                fill="currentColor"
              />

              <path
                d="M12 24.8c6.8-5.5 17.2-5.5 24 0l-4.5 4.9c-4.1-3.1-10.9-3.1-15 0L12 24.8Z"
                fill="currentColor"
              />

              <path
                d="M18.7 32.5c3.3-2.5 7.3-2.5 10.6 0L24 38l-5.3-5.5Z"
                fill="currentColor"
              />

            </svg>

          </div>


          <!-- Battery -->

          <div
            class="battery-wrap"
            aria-label="電量"
          >

    /* =========================================================
       Poe Canvas-compatible storage
       Poe Canvas disables browser localStorage, so keep state in memory.
       ========================================================= */

    const poeMemoryStore = Object.create(null);

    function safeLoad(key, fallback){
      try{
        return Object.prototype.hasOwnProperty.call(poeMemoryStore, key)
          ? JSON.parse(JSON.stringify(poeMemoryStore[key]))
          : fallback;
      }catch(error){
        console.warn("Poe Canvas storage load failed", error);
        return fallback;
      }
    }

    function safeSave(key, value){
      try{
        poeMemoryStore[key] = JSON.parse(JSON.stringify(value));
      }catch(error){
        console.warn("Poe Canvas storage save failed", error);
      }
    }

      return (

          .toString(36)
          .slice(2)
      );

    }

    /* =========================================================
       Date helper
       ========================================================= */

    function toDateInputValue(date){

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth()+1
        ).padStart(2,"0");

      const day =
        String(
          date.getDate()
        ).padStart(2,"0");

      return `${year}-${month}-${day}`;

    }


    /* =========================================================
       Escape HTML
       ========================================================= */

    function escapeHtml(value){

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }

       Phone status
       ========================================================= */

    function getDefaultPhoneStatus(){

      return {

        time:"09:52",

        signal:4,

      };

    }


    function savePhoneStatus(){

      const timeInput =
        document.getElementById(
          "phoneTimeInput"
        );

      const signalInput =
        document.getElementById(
          "signalInput"
        );

      const batteryInput =
        document.getElementById(
          "batteryInput"
        );

      if(
        !timeInput ||
        !signalInput ||
        !batteryInput
      ){

        return;

      }


      safeSave(
        STORAGE_KEYS.phoneStatus,
        {

          time:
            timeInput.value ||
            "09:52",

          signal:
            Number(
              signalInput.value
            ),

          battery:
            Number(
              batteryInput.value
            )

        }
      );

    }


    function loadPhoneStatus(){

      const saved =
        safeLoad(
          STORAGE_KEYS.phoneStatus,
          getDefaultPhoneStatus()
        );


      const timeInput =
        document.getElementById(
          "phoneTimeInput"
        );

      const signalInput =
        document.getElementById(
          "signalInput"
        );

      const batteryInput =
        document.getElementById(
          "batteryInput"
        );


      timeInput.value =
        saved.time || "09:52";


      signalInput.value =
        String(
          saved.signal ?? 4
        );


      batteryInput.value =
        String(
          saved.battery ?? 70
        );


      updatePhoneTime();

      updateSignalBars();

      updateBattery();

    }


    /* =========================================================
       Phone time
       ========================================================= */

    function updatePhoneTime(){

      const input =
        document.getElementById(
          "phoneTimeInput"
        );

      const display =
        document.getElementById(
          "statusTime"
        );


      if(!input || !display){

        return;

      }


      const value =
        input.value || "09:52";


      const parts =
        value.split(":");


      if(parts.length !== 2){

        display.textContent =
          value;

        return;

      }


      const hour =
        Number(parts[0]);


      const minute =
        parts[1];


      if(Number.isNaN(hour)){

        display.textContent =
          value;

        return;

      }


      display.textContent =
        `${String(hour).padStart(2,"0")}:${minute}`;

    }


    /* =========================================================
       Signal
       ========================================================= */

    function updateSignalBars(){

      const input =
        document.getElementById(
          "signalInput"
        );

      const bars =
        document.querySelectorAll(
          ".signal span"
        );


      if(!input || !bars.length){

        return;

      }


      const level =
        Math.max(
          0,
          Math.min(
            4,
            Number(input.value)
          )
        );


      bars.forEach(
        (bar,index)=>{

          bar.classList.toggle(
            "active",
            index < level
          );

        }
      );

    }


    /* =========================================================
       Battery
       ========================================================= */

    function updateBattery(){

      const input =
        document.getElementById(
          "batteryInput"
        );

      const fill =
        document.querySelector(
          ".battery-fill"
        );

      const number =
        document.querySelector(
          ".battery-number"
        );

      const label =
        document.getElementById(
          "batteryValueLabel"
        );


      if(
        !input ||
        !fill ||
        !number
      ){

        return;

      }


      const battery =
        Math.max(
          0,
          Math.min(
            100,
            Number(input.value)
          )
        );


      /*
       * 填充比例
       */
      fill.style.width =
        `${battery}%`;


      /*
       * 電量數字
       */
      number.textContent =
        battery;


      /*
       * 控制面板數字
       */
      if(label){

        label.textContent =
          `${battery}%`;

      }


      /*
       * 顏色
       */
      fill.classList.remove(
        "low",
        "medium",
        "high"
      );


      if(battery <= 19){

        fill.classList.add(
          "low"
        );

      }else if(battery <= 49){

        fill.classList.add(
          "medium"
        );

      }else{

        fill.classList.add(
          "high"
        );

      }


      /*
       * 0% 完全清空
       */
      if(battery <= 0){

        fill.style.width =
          "0%";

      }

    }

    function initPhoneStatusControls(){

          "input",

            updatePhoneTime();
            savePhoneStatus();
          }
        );

        timeInput.addEventListener(
          "change",
          ()=>{
            updatePhoneTime();
            savePhoneStatus();
          }
        );

      if(signalInput){

        signalInput.addEventListener(
          "input",
          ()=>{
            updateSignalBars();
            savePhoneStatus();
          }
        );

        signalInput.addEventListener(
          "change",
          ()=>{
            updateSignalBars();
            savePhoneStatus();
          }
        );

      if(batteryInput){

        batteryInput.addEventListener(
          "input",
          ()=>{
            updateBattery();
            savePhoneStatus();
          }
        );

        batteryInput.addEventListener(
          "change",
          ()=>{

            savePhoneStatus();
          }
        );

      }


      loadPhoneStatus();

    }

    /* =========================================================

    function addOrder(){

      const status =
        document.getElementById(
          "orderStatus"
        ).value;


      const date =
        document.getElementById(
          "dateInput"
        ).value;


      const time =
        document.getElementById(
          "timeInput"
        ).value;


      const vehicle =
        document.getElementById(
          "vehicle"
        ).value;


      const price =
        document.getElementById(
          "priceInput"
        ).value.trim();


      const origin =
        document.getElementById(
          "originInput"
        ).value.trim();


      const destination =
        document.getElementById(
          "destinationInput"
        ).value.trim();


      if(
        !date ||
        !time ||
        price === "" ||
        !origin ||
        !destination
      ){

        showToast(
          "請填寫日期、時間、價錢、起點及終點地址。"
        );

        return;

      }


      if(
        Number.isNaN(Number(price)) ||
        Number(price) < 0
      ){

        showToast(
          "請輸入有效價錢。"
        );

        return;

      }


      orders.unshift({

        id:createId(),

        status,

        date,

        time,

        vehicle,

        price,

        origin,

        destination

      });


      activeTab =
        status;


      saveAll();

      renderTabs();

      renderOrders();

      renderOrderList();

      clearOrderForm(false);

      showToast(
        "已新增訂單。"
      );

    }

    /* =========================================================
       Date format
       ========================================================= */

    function formatDateTime(
      dateValue,
      timeValue
    ){

      const date =
        new Date(
          `${dateValue}T${timeValue}:00`
        );


      if(
        Number.isNaN(
          date.getTime()
        )
      ){

        return `${dateValue}, ${timeValue}`;

      }


      const weekdays = [

        "週日",
        "週一",
        "週二",
        "週三",
        "週四",
        "週五",
        "週六"

      ];


      const weekday =
        weekdays[
          date.getDay()
        ];


      const month =
        date.getMonth()+1;


      const day =
        date.getDate();


      const hour24 =
        date.getHours();


      const minute =
        String(
          date.getMinutes()
        ).padStart(
          2,
          "0"
        );


      const period =
        hour24 < 12
          ? "上午"
          : "下午";


      let hour12 =
        hour24 % 12;


      if(hour12 === 0){

        hour12 = 12;

      }


      return `
        ${weekday},
        ${month}月${day}日,
        ${period}
        ${String(hour12).padStart(2,"0")}:${minute}
      `.replace(/\s+/g," ").trim();

    }


    /* =========================================================
       Money
       ========================================================= */

    function formatMoney(value){

      const number =
        Number(value);


      if(
        Number.isNaN(number) ||
        !Number.isFinite(number)
      ){

        return "0.00";

      }


      return number.toFixed(2);

    }


    /* =========================================================
       PNG download
       ========================================================= */

    async function downloadPNG(){

      const target = document.getElementById("captureArea");
      const phoneScale = document.querySelector(".phone-scale");
      const button = document.getElementById("downloadBtn");

      if (!target || !phoneScale || !button) {
        showToast("找不到圖片匯出區域。");
        return;
      }

      // Poe Canvas runs inside a sandboxed iframe. html2canvas creates
      // another iframe internally, which causes Safari/Poe's sandbox
      // "cross-origin frame" security error. html-to-image avoids that
      // iframe access and renders the DOM through an SVG data image.
      if (typeof htmlToImage === "undefined") {
        showToast("圖片工具未成功載入。請確認網絡正常後再試。");
        return;
      }

      const originalTransform = phoneScale.style.transform;
      const originalHeight = phoneScale.style.height;

      try {

        button.disabled = true;
        button.style.opacity = ".65";
        button.textContent = "正在產生 PNG...";
        showToast("正在產生圖片，請稍候...");

        // Capture the phone at its real 1320 × 2868 size.
        phoneScale.style.transform = "none";
        phoneScale.style.height = "2868px";

        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        // Wait for layout/paint to settle.
        await new Promise(resolve => requestAnimationFrame(resolve));
        await new Promise(resolve => requestAnimationFrame(resolve));

        // Decode images before cloning the DOM.
        const captureImages = Array.from(target.querySelectorAll("img"));
        await Promise.all(
          captureImages.map(async img => {
            try {
              if (!img.complete) {
                await new Promise(resolve => {
                  img.addEventListener("load", resolve, { once: true });
                  img.addEventListener("error", resolve, { once: true });
                });
              }
              if (typeof img.decode === "function") {
                await img.decode();
              }
            } catch (_) {}
          })
        );

        const dataUrl = await htmlToImage.toPng(target, {
          backgroundColor: "#eeeeef",
          width: 1320,
          height: 2868,
          pixelRatio: 1,
          cacheBust: false,
          skipFonts: false,
          filter: node => {
            // Never copy the download button itself into the phone image.
            return node?.id !== "downloadBtn";
          }
        });

        if (!dataUrl || !dataUrl.startsWith("data:image/png")) {
          throw new Error("PNG 編碼失敗");
        }

        const fileName = `訂單畫面_${Date.now()}.png`;
        const link = document.createElement("a");
        link.href = dataUrl;
        link.download = fileName;
        link.style.display = "none";

        document.body.appendChild(link);
        link.click();
        link.remove();

        showToast("PNG 已成功產生。");

      } catch (error) {

        console.error("PNG export error:", error);

        showToast(
          `產生 PNG 失敗：${error?.message || "未知錯誤"}`
        );

      } finally {

        phoneScale.style.transform = originalTransform;
        phoneScale.style.height = originalHeight;

        button.disabled = false;
        button.style.opacity = "1";
        button.textContent = "下載訂單畫面 PNG";

        requestAnimationFrame(fitPhonePreview);
      }
    }

    /* =========================================================
       iPhone preview auto-fit
       ========================================================= */
    function fitPhonePreview(){
      if (window.innerWidth > 1100) return;

      const wrap = document.querySelector(".preview-wrap");
      const phoneScale = document.querySelector(".phone-scale");

      if (!wrap || !phoneScale) return;

      const availableWidth =
        wrap.clientWidth || window.innerWidth;

      const scale =
        Math.min(1, availableWidth / 1320);

      phoneScale.style.transform =
        `scale(${scale})`;

      phoneScale.style.height =
        `${2868 * scale}px`;
    }
    window.addEventListener("resize",fitPhonePreview);

    /* =========================================================
       Toast
       ========================================================= */

    let toastTimer =
      null;


    function showToast(
      message
    ){

      let toast =
        document.getElementById(
          "toast"
        );


      if(!toast){

        toast =
          document.createElement(
            "div"
          );


        toast.id =
          "toast";


        Object.assign(
          toast.style,
          {

            position:"fixed",

            left:"50%",

            bottom:"28px",

            transform:
              "translateX(-50%)",

            background:
              "rgba(0,0,0,.82)",

            color:"#fff",

            padding:"12px 18px",

            borderRadius:"999px",

            fontSize:"14px",

            fontWeight:"700",

            zIndex:"9999",

            boxShadow:
              "0 8px 24px rgba(0,0,0,.25)",

            transition:
              "opacity .25s ease"

          }
        );


        document.body.appendChild(
          toast
        );

      }


      toast.textContent =
        message;


      toast.style.opacity =
        "1";


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () =>
            toast.style.opacity =
              "0",
          3000
        );

    }


    /* =========================================================

    init();
